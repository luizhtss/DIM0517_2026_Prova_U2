name: Java

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build
        run: mvn -B compile

      - name: Test
        run: mvn test

      - name: Docker build
        run: docker build -t api-java .

      - name: Docker run
        run: docker run -d -p 8080:8080 api-java
