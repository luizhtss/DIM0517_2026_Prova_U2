name: Java

on:
  pull_request:
    branches:
      - develop
    types:
      - closed

jobs:
  build:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build
        run: mvn -B compile

      - name: Tag
        if: success()
        run: |
          TAG="build-${{ github.run_id }}"
          git tag "$TAG"
          git push origin "$TAG"

